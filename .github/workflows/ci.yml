name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability audit

        run: npm audit --audit-level=high || true
      - run: npm run lint
      - run: npm test
      - name: Fail if discovered test files dropped below the committed floor
        run: |
          actual=$(npx vitest list --filesOnly 2>/dev/null | wc -l | tr -d ' ')
          minimum=$(cat .github/min-test-files)
          echo "Discovered $actual test file(s); committed minimum is $minimum."
          if [ "$actual" -lt "$minimum" ]; then
            echo "::error::Test file count dropped below the committed minimum ($actual < $minimum). A test file may have silently stopped being discovered (e.g. an include-pattern or config regression — this is exactly the bug that let ProxiedPhoto.test.tsx go unrun for a while). If this drop is intentional, lower .github/min-test-files in the same change."
            exit 1
          fi

      - run: npm run build
      - run: npm run typecheck
