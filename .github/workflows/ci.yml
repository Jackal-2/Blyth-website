name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `next build` generates .next/types (the ambient LayoutProps/PageProps
      # helpers Next.js's typed-routes feature uses in route files) as a side
      # effect, before running its own internal type-check. A standalone
      # `tsc --noEmit` has no way to generate those on its own, so it must run
      # AFTER build, once .next/types already exists on disk — not before.
      - run: npm run build
      - run: npm run typecheck
